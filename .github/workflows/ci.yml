name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned to the SDK the project was created with (.metadata revision
          # b0850bee = 3.22.3). intl 0.19.0 in pubspec must match the version
          # flutter_localizations pins, so bump both together.
          flutter-version: 3.22.3
          cache: true

      - run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test
