name: easytrip
description: "EasyTrip — regional intercity transport booking & payment (DRC · Rwanda · Uganda · Kenya)."
publish_to: "none"

# App version (versionName+versionCode). Bump before each store release.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (clean architecture — presentation layer)
  flutter_bloc: 8.1.6
  bloc: 8.1.4
  equatable: 2.0.5

  # Dependency injection
  get_it: 7.7.0

  # Networking
  dio: 5.7.0

  # Navigation
  go_router: 14.2.7

  # Secure token storage (encrypted platform storage)
  flutter_secure_storage: 9.2.2

  # i18n message formatting (version is pinned by flutter_localizations)
  intl: 0.19.0
  qr_flutter: 4.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: 9.1.7
  mocktail: 1.0.4
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # enables l10n code generation from lib/l10n/*.arb